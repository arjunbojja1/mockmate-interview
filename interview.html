<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MockMate — Interview Room</title>
<link rel="stylesheet" href="style.css?v=8" />
<link rel="stylesheet" href="vendor/codemirror/codemirror.min.css" />
<link rel="stylesheet" href="vendor/codemirror/theme/dracula.min.css" />
</head>
<body class="room">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">M</div>
      <span class="brand-name">MockMate</span>
    </div>
    <div class="room-meta">
      <span>room <span class="room-code-chip" id="roomChip">------</span></span>
      <button class="mini-btn hidden" id="copyRoomLink">Copy invite link</button>
      <span class="timer" id="timer">00:00</span>
      <span class="conn-status"><span class="conn-dot" id="connDot"></span><span id="connText">waiting for peer</span></span>
      <button class="mini-btn deny hidden" id="endAccessBtn">End access</button>
      <span class="verdict-badge hidden" id="verdictBadge"></span>
      <a href="index.html" class="leave-link" id="leaveLink">Leave</a>
    </div>
  </div>

  <div class="error-banner hidden" id="errorBanner"></div>

  <div class="admit-banner hidden" id="admitBanner">
    <span id="admitBannerText"></span>
    <button class="mini-btn reveal" id="admitBtn">Let them in</button>
    <button class="mini-btn deny" id="denyBtn">Deny</button>
  </div>

  <div class="main-layout">
    <div class="editor-pane">
      <div class="editor-toolbar">
        <select id="langSelect">
          <option value="python" selected>Python</option>
          <option value="javascript">JavaScript</option>
          <option value="cpp">C++</option>
          <option value="java">Java</option>
        </select>
        <button class="run" id="runBtn">Run</button>
        <button id="runTestsBtn">Run tests</button>
        <button id="clearOutputBtn">Clear output</button>
      </div>
      <textarea id="codeArea"></textarea>
      <div class="output-pane" id="outputPane">Output shows up here once you run your code.</div>
    </div>

    <div class="resize-handle" id="resizeHandle"></div>

    <div class="side-pane" id="sidePane">
      <div class="question-pane">
        <div class="side-header-row">
          <span class="side-header">question</span>
          <div class="question-actions" id="interviewerQuestionActions">
            <button class="mini-btn" id="importLeetcodeBtn">Import from LeetCode</button>
            <button class="mini-btn reveal" id="revealBtn">Show to candidate</button>
          </div>
          <span class="hidden-note hidden" id="candidateHiddenNote">not shared yet</span>
        </div>
        <div class="question-meta" id="questionMeta">
          <select id="difficultySelect">
            <option value="">Difficulty</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
          <input id="tagsInput" placeholder="tags, comma separated" autocomplete="off" />
        </div>
        <div class="question-badges hidden" id="questionBadges"></div>
        <textarea id="questionArea" placeholder="Paste the question, constraints, and examples here."></textarea>

        <div class="import-panel hidden" id="importPanel">
          <input id="importUrlInput" placeholder="LeetCode problem URL (optional, for reference)" autocomplete="off" />
          <textarea id="importPasteArea" placeholder="Paste the problem statement copied from LeetCode here (LeetCode doesn't allow fetching it automatically, so paste it in)."></textarea>
          <div class="import-actions">
            <button class="mini-btn" id="importCancelBtn">Cancel</button>
            <button class="mini-btn reveal" id="importConfirmBtn">Use this question</button>
          </div>
        </div>
      </div>

      <div class="testcase-pane hidden" id="testcasePane">
        <div class="side-header-row">
          <span class="side-header">test cases</span>
          <button class="mini-btn" id="addTestcaseBtn">+ Add case</button>
        </div>
        <div id="testcaseList"></div>
      </div>

      <div class="solution-pane hidden" id="solutionPane">
        <div class="side-header">solution — only you see this</div>
        <textarea id="solutionArea" placeholder="Jot the expected approach, complexity, or reference solution. Never sent to the candidate."></textarea>
      </div>

      <div class="paste-log hidden" id="pasteLog">
        <div class="side-header">paste activity — only you see this</div>
        <div class="paste-log-list" id="pasteLogList"><div class="paste-log-empty">No large pastes yet.</div></div>
      </div>

      <div class="feedback-pane hidden" id="feedbackPane">
        <div class="side-header">feedback</div>
        <div class="feedback-scores" id="feedbackScores"></div>
        <textarea id="feedbackSummary" placeholder="Overall summary — strengths, gaps, would you move them forward?"></textarea>
        <div class="verdict-buttons">
          <button class="verdict-btn pass" id="passBtn">Pass</button>
          <button class="verdict-btn fail" id="failBtn">No pass</button>
          <button class="verdict-btn clear" id="clearVerdictBtn">Clear</button>
        </div>
        <button class="mini-btn copy-feedback" id="copyFeedbackBtn">Copy session summary</button>
        <button class="mini-btn reset-room" id="resetRoomBtn">Reset for next candidate</button>
      </div>
    </div>
  </div>

<script>
window.addEventListener('error', function (e) {
  var el = document.getElementById('errorBanner');
  if (!el) return;
  el.textContent = 'Something failed to load (' + (e.message || 'script error') + '). Try a hard refresh — if it keeps happening, this browser may be blocking a required script.';
  el.classList.remove('hidden');
});
</script>
<script src="vendor/codemirror/codemirror.min.js"></script>
<script src="vendor/codemirror/mode/javascript/javascript.min.js"></script>
<script src="vendor/codemirror/mode/clike/clike.min.js"></script>
<script src="vendor/codemirror/mode/python/python.min.js"></script>
<script src="vendor/peerjs/peerjs.min.js"></script>
<script src="app.js?v=8"></script>
</body>
</html>
